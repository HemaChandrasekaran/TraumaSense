<!DOCTYPE html>
<html>
<head>
    <title>TraumaSense - Mood Diary</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #263238;
        }

        .moods {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .mood {
            font-size: 35px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
        }

        .mood:hover {
            border-color: #4f8cff;
            transform: scale(1.05);
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #4f8cff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .entry {
            background: #f8fafc;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
        }

        a {
            text-decoration: none;
            color: #4f8cff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📔 Mood Diary</h1>

        <p>
            Record how you are feeling today.
        </p>

        <form action="/mood-diary/save" method="POST">

            <div class="moods">

                <label>
                    <input type="radio"
                           name="mood"
                           value="Very Sad"
                           hidden>
                    <span class="mood">😢</span>
                </label>

                <label>
                    <input type="radio"
                           name="mood"
                           value="Sad"
                           hidden>
                    <span class="mood">😔</span>
                </label>

                <label>
                    <input type="radio"
                           name="mood"
                           value="Neutral"
                           hidden>
                    <span class="mood">😐</span>
                </label>

                <label>
                    <input type="radio"
                           name="mood"
                           value="Good"
                           hidden>
                    <span class="mood">🙂</span>
                </label>

                <label>
                    <input type="radio"
                           name="mood"
                           value="Very Good"
                           hidden>
                    <span class="mood">😊</span>
                </label>

            </div>

            <textarea
                name="note"
                placeholder="Write something about how you feel..."></textarea>

            <br>

            <button type="submit">
                Save Mood
            </button>

        </form>

    </div>


    <div class="card">

        <h2>Previous Entries</h2>

        {% if moods %}

            {% for entry in moods|reverse %}

                <div class="entry">

                    <strong>
                        {{ entry.mood }}
                    </strong>

                    {% if entry.note %}
                        <p>{{ entry.note }}</p>
                    {% endif %}

                </div>

            {% endfor %}

        {% else %}

            <p>No mood entries yet.</p>

        {% endif %}

    </div>

    <a href="/assessment">
        ← Back to Assessment
    </a>

</div>

</body>
</html>
