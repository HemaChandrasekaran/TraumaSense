<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Anonymous Help</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff8f4, #f5f8ff);
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            color: #6246ea;
        }

        #chatBox {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            max-width: 80%;
        }

        .user {
            background: #e8e1ff;
            margin-left: auto;
        }

        .reviewer {
            background: #eeeeee;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button,
        a {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #6246ea;
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            background: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>👤 Anonymous Help</h1>

        <p>

            You can share information without providing
            unnecessary personal identification details.

        </p>

        <div id="chatBox"></div>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Type your message...">

            <button onclick="sendMessage()">

                Send

            </button>

        </div>

        <button
            onclick="clearChat()"
            style="margin-top:10px;">

            Clear Chat

        </button>

        <br>

        <a href="/result" class="back">

            ← Back to Result

        </a>

    </div>

</div>


<script>

const chatBox =
    document.getElementById(
        "chatBox"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


function addMessage(
    sender,
    message
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "message " + sender;

    div.innerText =
        message;

    chatBox.appendChild(
        div
    );

    chatBox.scrollTop =
        chatBox.scrollHeight;
}


async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {

        return;

    }

    addMessage(
        "user",
        message
    );

    messageInput.value = "";


    try {

        const response =
            await fetch(
                "/anonymous-chat/send",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: message
                        })
                }
            );


        const data =
            await response.json();


        if (data.reply) {

            addMessage(
                "reviewer",
                data.reply
            );

        }

    }

    catch(error) {

        addMessage(
            "reviewer",
            "Unable to connect right now. Please try again."
        );

    }

}


async function clearChat() {

    await fetch(
        "/anonymous-chat/clear",
        {
            method: "POST"
        }
    );

    chatBox.innerHTML = "";

}


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            sendMessage();

        }

    }
);

</script>

</body>

</html>
