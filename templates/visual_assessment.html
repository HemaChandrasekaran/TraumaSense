<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Visual Emotional Assessment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .header h1 {
            margin-top: 0;
            color: #243b53;
        }

        .header p {
            color: #667085;
            line-height: 1.6;
        }

        .instruction {
            background: #eef5ff;
            border: 1px solid #d7e7ff;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            color: #1d4ed8;
            font-weight: bold;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .image-card {
            background: white;
            border-radius: 16px;
            padding: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .image-card:hover {
            transform: translateY(-3px);
        }

        .image-card.selected {
            border: 3px solid #2563eb;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
        }

        .image-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        .image-card input {
            display: none;
        }

        .selected-text {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #2563eb;
            min-height: 24px;
        }

        .description-box {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .description-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .note {
            text-align: center;
            color: #667085;
            font-size: 13px;
            margin-top: 15px;
        }

        @media (max-width: 700px) {

            .image-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .image-card img {
                height: 180px;
            }
        }

        @media (max-width: 450px) {

            .image-grid {
                grid-template-columns: 1fr;
            }

            .image-card img {
                height: 230px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Visual Emotional Response</h1>

        <p>
            Look at the images and choose the one that
            best represents how you feel right now.
        </p>

        <div class="instruction">
            Choose ONE image that best represents your
            current emotional state.
        </div>

    </div>


    <form
        method="POST"
        action="{{ url_for('visual_assessment_analyze') }}"
        onsubmit="return validateForm();"
    >

        <div class="image-grid">

            {% for image in images %}

            <label
                class="image-card"
                onclick="selectImage(this);"
            >

                <input
                    type="radio"
                    name="selected_image"
                    value="{{ image }}"
                >

                <img
                    src="{{ url_for(
                        'static',
                        filename='captcha_images/' + image
                    ) }}"
                    alt="Emotional image"
                >

            </label>

            {% endfor %}

        </div>


        <div
            class="selected-text"
            id="selectedText"
        >
            No image selected
        </div>


        <div class="description-box">

            <label for="description">

                What does this image make you feel
                or what does it represent to you?

            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe what you feel or notice..."
            ></textarea>

        </div>


        <button
            type="submit"
            class="submit-btn"
        >
            Continue with Visual Assessment
        </button>


        <div class="note">

            Your response is used only as an
            AI-assisted screening input.

        </div>

    </form>

</div>


<script>

function selectImage(card) {

    const cards =
        document.querySelectorAll(".image-card");

    cards.forEach(function(item) {
        item.classList.remove("selected");
    });

    card.classList.add("selected");

    const radio =
        card.querySelector("input");

    radio.checked = true;

    document.getElementById(
        "selectedText"
    ).innerText =
        "✓ Image selected";
}


function validateForm() {

    const selected =
        document.querySelector(
            'input[name="selected_image"]:checked'
        );

    const description =
        document.getElementById(
            "description"
        ).value.trim();

    if (!selected) {

        alert(
            "Please choose an image that best represents your mood."
        );

        return false;
    }

    if (!description) {

        alert(
            "Please describe what you feel or notice in the image."
        );

        return false;
    }

    return true;
}

</script>

</body>

</html>
